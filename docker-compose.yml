services:
  firelab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firelab
    ports:
      - "3001:3001"           # Backend API + Frontend
      - "4000-4010:4000-4010" # Emulator UI range
      - "5000-5010:5000-5010" # Hosting range
      - "8080-8090:8080-8090" # Firestore range
      - "9000-9010:9000-9010" # Database range
      - "9099-9109:9099-9109" # Auth range
      - "9199-9209:9199-9209" # Storage range
    volumes:
      - ./firebase-projects:/app/firebase-projects
      - firebase-cache:/root/.cache/firebase
    environment:
      - NODE_ENV=production
      # - FIREBASE_TOKEN=your_token_here
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  firebase-cache:
